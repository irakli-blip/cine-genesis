<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test API Agnes</title>
<style>
    body { background: #0a0a12; color: #e8e6e0; font-family: sans-serif; padding: 2rem; max-width: 800px; margin: auto; }
    h1 { color: #e5c15a; text-align: center; }
    input, textarea { width: 100%; padding: 1rem; background: #12121c; color: #fff; border: 1px solid #333; border-radius: 5px; margin-bottom: 1rem; box-sizing: border-box; }
    button { padding: 1rem; background: #e5c15a; color: #000; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.1rem; }
    #journal { background: #000; color: #0f0; font-family: monospace; padding: 1rem; height: 300px; overflow-y: auto; margin-top: 2rem; border: 1px solid #333; font-size: 12px; }
</style>
</head>
<body>

<h1>Test API Agnes AI</h1>
<label>Clé API :</label>
<input type="text" id="apiKey" placeholder="sk-...">
<label>Sujet :</label>
<textarea id="sujet">Un homme marchant sur la lune</textarea>
<button onclick="testerModes()">▶ Tester tous les modes</button>
<div id="journal"></div>

<script>
function log(msg, color = '#fff') {
    const j = document.getElementById('journal');
    j.innerHTML += `<div style="color:${color}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
    j.scrollTop = j.scrollHeight;
}

async function testerModes() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const prompt = document.getElementById('sujet').value.trim();
    if(!apiKey || !prompt) { alert("Remplis tout !"); return; }

    // La liste des noms possibles pour le mode
    const modes = [
        "text-to-video", "t2v", "video", "text2video", "generate", 
        "standard", "default", "text_to_video", "text2vid", "t2vid"
    ];

    for (let mode of modes) {
        log("Essai avec le mode : '" + mode + "'...", "#e5c15a");
        try {
            const response = await fetch('https://apihub.agnes-ai.com/v1/videos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
                body: JSON.stringify({ model: "agnes-video-2.5", prompt: prompt, mode: mode })
            });
            const data = await response.json();

            if (response.ok) {
                log("✅ SUCCÈS ! Le bon mode est : '" + mode + "'", "#55ff55");
                log("ID de la tâche : " + data.id, "#55ff55");
                // On lance l'attente
                attendreVideo(data.id, apiKey);
                return; // On s'arrête là, on a trouvé !
            } else {
                log("❌ Échec (" + mode + ") : " + (data.message || "Erreur"), "#ff5555");
            }
        } catch (e) {
            log("Erreur réseau : " + e.message, "#ff5555");
        }
    }
    log("Aucun mode n'a fonctionné. Désolé.", "#ff5555");
}

async function attendreVideo(id, apiKey) {
    log("Attente de la vidéo...", "#e5c15a");
    let tentatives = 0;
    const interval = setInterval(async () => {
        tentatives++;
        try {
            const poll = await fetch(`https://apihub.agnes-ai.com/agnesapi?video_id=${id}&model_name=agnes-video-2.5`, {
                headers: { 'Authorization': 'Bearer ' + apiKey }
            });
            const pollData = await poll.json();
            if (pollData.status === 'completed' || pollData.url) {
                clearInterval(interval);
                log("🎉 VIDÉO PRÊTE !", "#55ff55");
                const url = pollData.url || pollData.data?.url;
                if(url) document.body.innerHTML += `<video src="${url}" controls autoplay style="width:100%;margin-top:1rem;"></video>`;
            } else {
                log("Vérification " + tentatives + "... (" + (pollData.status || 'en cours') + ")");
            }
            if (tentatives > 30) { clearInterval(interval); log("Trop long.", "#ff5555"); }
        } catch(e) { log("Erreur attente : " + e.message, "#ff5555"); }
    }, 5000);
}
</script>
</body>
</html>

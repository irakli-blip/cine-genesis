<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Test API Agnes</title>
<style>
    body { background: #0a0a12; color: #e8e6e0; font-family: sans-serif; padding: 2rem; max-width: 800px; margin: auto; }
    h1 { color: #e5c15a; text-align: center; }
    input, textarea { width: 100%; padding: 1rem; background: #12121c; color: #fff; border: 1px solid #333; margin-bottom: 1rem; box-sizing: border-box; }
    button { padding: 1rem; background: #e5c15a; color: #000; border: none; font-weight: bold; cursor: pointer; width: 100%; }
    #journal { background: #000; color: #0f0; font-family: monospace; padding: 1rem; height: 300px; overflow-y: auto; margin-top: 2rem; border: 1px solid #333; }
</style>
</head>
<body>
<h1>Test API Agnes (Version Finale)</h1>
<label>Clé API :</label><input type="text" id="apiKey">
<label>Sujet :</label><textarea id="sujet">Un homme marchant sur la lune</textarea>
<button onclick="generer()">▶ Lancer</button>
<div id="journal"></div>

<script>
function log(msg, color = '#fff') {
    const j = document.getElementById('journal');
    j.innerHTML += `<div style="color:${color}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
    j.scrollTop = j.scrollHeight;
}

async function generer() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const prompt = document.getElementById('sujet').value.trim();
    
    log("Envoi de la requête...", "#e5c15a");

    try {
        // L'URL spécifique à leur système "agnesapi"
        const response = await fetch('https://apihub.agnes-ai.com/agnesapi/videos', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + apiKey
            },
            body: JSON.stringify({
                model: "agnes-video-2.5",
                prompt: prompt
            })
        });

        const data = await response.json();

        if (!response.ok) {
            log("ERREUR API : " + JSON.stringify(data), "#ff5555");
            return;
        }

        log("SUCCÈS ! Tâche créée. ID : " + data.id, "#55ff55");
        log("Attente de la génération (1-2 min)...", "#e5c15a");

        let tentatives = 0;
        const interval = setInterval(async () => {
            tentatives++;
            log("Vérification " + tentatives + "...");

            try {
                // L'URL de vérification
                const poll = await fetch(`https://apihub.agnes-ai.com/agnesapi?video_id=${data.id}&model_name=agnes-video-2.5`, {
                    method: 'GET',
                    headers: { 'Authorization': 'Bearer ' + apiKey }
                });
                
                const pollData = await poll.json();

                if (pollData.status === 'completed' || pollData.status === 'succeeded' || pollData.url) {
                    clearInterval(interval);
                    log("VIDÉO PRÊTE !", "#55ff55");
                    const url = pollData.url || pollData.data?.url;
                    if(url) document.body.innerHTML += `<video src="${url}" controls autoplay style="width:100%;margin-top:1rem;"></video>`;
                } else if (pollData.status === 'failed') {
                    clearInterval(interval);
                    log("ÉCHEC.", "#ff5555");
                }
            } catch(e) {
                log("Erreur vérif : " + e.message, "#ff5555");
            }
            if (tentatives > 40) { clearInterval(interval); log("Trop long.", "#ff5555"); }
        }, 5000);

    } catch (error) {
        log("Erreur réseau : " + error.message, "#ff5555");
    }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genesis - Générateur Vidéo IA</title>
<style>
:root {
--bg: #0a0a12;
--bg2: #12121c;
--bg3: #1a1a28;
--panel: #16161f;
--border: #2a2a3a;
--text: #e8e6e0;
--text-dim: #8a8896;
--accent: #e5c15a;
--accent2: #e87b35;
--success: #4ade80;
}

* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 100%);
color: var(--text);
min-height: 100vh;
padding: 2rem;
}

.container {
max-width: 900px;
margin: 0 auto;
}

header {
text-align: center;
margin-bottom: 3rem;
padding: 2rem;
background: var(--panel);
border-radius: 16px;
border: 1px solid var(--border);
box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

h1 {
font-size: 2.5rem;
background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
margin-bottom: 0.5rem;
font-weight: 700;
}

.subtitle {
color: var(--text-dim);
font-size: 1.1rem;
}

.generator-panel {
background: var(--panel);
border-radius: 16px;
padding: 2rem;
border: 1px solid var(--border);
margin-bottom: 2rem;
}

.form-group {
margin-bottom: 1.5rem;
}

label {
display: block;
margin-bottom: 0.5rem;
color: var(--accent);
font-weight: 600;
font-size: 0.95rem;
}

input[type="text"],
textarea,
select {
width: 100%;
padding: 1rem;
background: var(--bg3);
border: 2px solid var(--border);
border-radius: 8px;
color: var(--text);
font-size: 1rem;
transition: all 0.3s ease;
}

input[type="text"]:focus,
textarea:focus,
select:focus {
outline: none;
border-color: var(--accent);
box-shadow: 0 0 0 3px rgba(229, 193, 90, 0.1);
}

textarea {
min-height: 120px;
resize: vertical;
}

.grid-2 {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 1rem;
}

.btn {
background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
color: var(--bg);
border: none;
padding: 1rem 2rem;
font-size: 1.1rem;
font-weight: 700;
border-radius: 8px;
cursor: pointer;
width: 100%;
transition: transform 0.2s, box-shadow 0.2s;
}

.btn:hover {
transform: translateY(-2px);
box-shadow: 0 8px 20px rgba(229, 193, 90, 0.4);
}

.btn:active {
transform: translateY(0);
}

.preview-box {
background: var(--bg3);
border: 2px dashed var(--border);
border-radius: 8px;
padding: 1rem;
margin-top: 1rem;
font-family: 'Courier New', monospace;
color: var(--text-dim);
min-height: 80px;
}

.results {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
gap: 1.5rem;
margin-top: 2rem;
}

.video-card {
background: var(--panel);
border-radius: 12px;
overflow: hidden;
border: 1px solid var(--border);
transition: transform 0.3s;
}

.video-card:hover {
transform: translateY(-5px);
}

.video-placeholder {
background: linear-gradient(135deg, var(--bg3) 0%, var(--bg2) 100%);
height: 150px;
display: flex;
align-items: center;
justify-content: center;
color: var(--text-dim);
}

.video-info {
padding: 1rem;
}

.tag {
display: inline-block;
background: var(--bg3);
padding: 0.25rem 0.75rem;
border-radius: 20px;
font-size: 0.85rem;
color: var(--accent);
margin-top: 0.5rem;
}

@media (max-width: 768px) {
.grid-2 {
grid-template-columns: 1fr;
}

h1 {
font-size: 2rem;
}
}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🎬 Genesis</h1>
<p class="subtitle">Générateur de vidéos par IA - Prompts structurés</p>
</header>

<div class="generator-panel">
<div class="grid-2">
<div class="form-group">
<label for="sujet">📝 Sujet principal</label>
<input type="text" id="sujet" placeholder="Ex: Un dragon dans les nuages...">
</div>

<div class="form-group">
<label for="style">🎨 Style visuel</label>
<select id="style">
<option value="cinematique">Cinématique</option>
<option value="anime">Anime/Manga</option>
<option value="realiste">Réaliste</option>
<option value="3d">3D Animation</option>
<option value="vintage">Vintage/Retro</option>
</select>
</div>
</div>

<div class="form-group">
<label for="prompt">✨ Description détaillée</label>
<textarea id="prompt" placeholder="Décris ta scène en détail : ambiance, éclairage, mouvements de caméra, couleurs..."></textarea>
</div>

<div class="grid-2">
<div class="form-group">
<label for="duree">⏱️ Durée</label>
<select id="duree">
<option value="4">4 secondes</option>
<option value="8">8 secondes</option>
<option value="16">16 secondes</option>
</select>
</div>

<div class="form-group">
<label for="ratio">📐 Format</label>
<select id="ratio">
<option value="16:9">16:9 (Paysage)</option>
<option value="9:16">9:16 (Portrait)</option>
<option value="1:1">1:1 (Carré)</option>
</select>
</div>
</div>

<button class="btn" onclick="genererVideo()">
🚀 Générer la vidéo
</button>

<div class="form-group" style="margin-top: 1.5rem;">
<label>Aperçu du prompt</label>
<div class="preview-box" id="preview">
Ton prompt apparaîtra ici...
</div>
</div>
</div>

<div id="results" class="results"></div>
</div>

<script>
// Mise à jour en temps réel de l'aperçu
document.getElementById('prompt').addEventListener('input', updatePreview);
document.getElementById('sujet').addEventListener('input', updatePreview);
document.getElementById('style').addEventListener('change', updatePreview);

function updatePreview() {
const sujet = document.getElementById('sujet').value || '[Sujet]';
const prompt = document.getElementById('prompt').value || '[Description]';
const style = document.getElementById('style').value;

const preview = `
Style: ${style}
Sujet: ${sujet}
Description: ${prompt}
`.trim();

document.getElementById('preview').textContent = preview;
}

function genererVideo() {
const sujet = document.getElementById('sujet').value;
const prompt = document.getElementById('prompt').value;

if (!sujet || !prompt) {
alert('⚠️ Veuillez remplir tous les champs !');
return;
}

// Simulation de génération
const btn = document.querySelector('.btn');
btn.textContent = '⏳ Génération en cours...';
btn.disabled = true;

setTimeout(() => {
ajouterVideo(sujet, prompt);
btn.textContent = '🚀 Générer la vidéo';
btn.disabled = false;

// Reset partiel
document.getElementById('prompt').value = '';
updatePreview();
}, 2000);
}

function ajouterVideo(sujet, prompt) {
const results = document.getElementById('results');
const card = document.createElement('div');
card.className = 'video-card';

card.innerHTML = `
<div class="video-placeholder">
<span> Vidéo générée</span>
</div>
<div class="video-info">
<h3>${sujet}</h3>
<p style="color: var(--text-dim); font-size: 0.9rem; margin-top: 0.5rem;">
${prompt.substring(0, 60)}...
</p>
<span class="tag">Nouveau</span>
</div>
`;

results.insertBefore(card, results.firstChild);
}
</script>
</body>
</html>

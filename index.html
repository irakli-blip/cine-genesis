<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test API Agnes</title>
<style>
    body { background: #0a0a12; color: #e8e6e0; font-family: sans-serif; padding: 2rem; max-width: 800px; margin: auto; }
    h1 { color: #e5c15a; text-align: center; }
    input, textarea { width: 100%; padding: 1rem; background: #12121c; color: #fff; border: 1px solid #333; border-radius: 5px; margin-bottom: 1rem; box-sizing: border-box; }
    button { padding: 1rem; background: #e5c15a; color: #000; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.1rem; }
    button:hover { background: #d4b04a; }
    #journal { background: #000; color: #0f0; font-family: monospace; padding: 1rem; height: 200px; overflow-y: auto; margin-top: 2rem; border: 1px solid #333; font-size: 13px; }
</style>
</head>
<body>

<h1>Test API Agnes AI</h1>

<label>Clé API :</label>
<input type="text" id="apiKey" placeholder="sk-...">

<label>Sujet :</label>
<textarea id="sujet">Un homme marchant sur la lune</textarea>

<button onclick="generer()">▶ Lancer la génération</button>

<div id="journal"></div>

<script>
function log(msg, color = '#fff') {
    const j = document.getElementById('journal');
    j.innerHTML += `<div style="color:${color}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
    j.scrollTop = j.scrollHeight;
}

async function generer() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const prompt = document.getElementById('sujet').value.trim();
    
    if(!apiKey || !prompt) {
        alert("Remplis la clé et le sujet !");
        return;
    }

    log("Envoi de la requête à l'API Agnes...", "#e5c15a");

    try {
        const response = await fetch('https://apihub.agnes-ai.com/v1/videos', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + apiKey
            },
            body: JSON.stringify({
                model: "agnes-video-2.5",
                prompt: prompt,
                mode: "text-to-video"
            })
        });

        const data = await response.json();

        if (!response.ok) {
            log("ERREUR API : " + JSON.stringify(data), "#ff5555");
            return;
        }

        log("Tâche créée avec succès ! ID : " + data.id, "#55ff55");
        log("Attente de la génération (cela peut prendre 1 à 2 minutes)...", "#e5c15a");

        let tentatives = 0;
        const interval = setInterval(async () => {
            tentatives++;
            log("Vérification numéro " + tentatives + "...");

            try {
                const poll = await fetch(`https://apihub.agnes-ai.com/agnesapi?video_id=${data.id}&model_name=agnes-video-2.5`, {
                    method: 'GET',
                    headers: { 'Authorization': 'Bearer ' + apiKey }
                });
                
                const pollData = await poll.json();

                if (pollData.status === 'completed' || pollData.status === 'succeeded' || pollData.url) {
                    clearInterval(interval);
                    log("SUCCÈS ! La vidéo est prête.", "#55ff55");
                    const videoUrl = pollData.url || pollData.data?.url;
                    if(videoUrl) {
                        document.body.innerHTML += `<br><br><video src="${videoUrl}" controls autoplay style="width:100%; border-radius:10px;"></video>`;
                    } else {
                        log("Erreur : L'API a répondu mais l'URL est introuvable.", "#ff5555");
                    }
                } else if (pollData.status === 'failed') {
                    clearInterval(interval);
                    log("ÉCHEC : L'API a refusé la génération.", "#ff5555");
                }

                if (tentatives > 40) {
                    clearInterval(interval);
                    log("Temps écoulé (trop long).", "#ff5555");
                }
            } catch(e) {
                log("Erreur de vérification : " + e.message, "#ff5555");
            }
        }, 5000);

    } catch (error) {
        log("Erreur réseau : " + error.message, "#ff5555");
    }
}
</script>
</body>
</html>

<script>
const API_KEYS_STORAGE = 'video_prompt_studio_keys_v1';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showToast(message,type='success'){const t=document.getElementById('toast');t.className='toast '+type+' visible';document.getElementById('toast-text').textContent=message;setTimeout(()=>t.classList.remove('visible'),3000)}

// Fonction pour afficher des messages dans ton panneau "Journal" en bas
function journalLog(msg, level = 'info') {
    const body = document.getElementById('journal-body');
    if(!body) return;
    const entry = document.createElement('div');
    entry.style.cssText = 'font-size:.75rem; padding:.3rem 0; border-bottom:1px dashed rgba(255,255,255,.1); color:' + (level === 'error' ? '#c85a4a' : (level === 'success' ? '#4a9d6a' : '#d8d8e0'));
    entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    body.appendChild(entry);
    body.scrollTop = body.scrollHeight;
}

document.addEventListener('DOMContentLoaded', () => {
    journalLog("Application initialisée");
    
    // Accordéons
    document.querySelectorAll('.section-header').forEach(h => {
        h.addEventListener('click', () => h.parentElement.classList.toggle('open'));
    });
    
    // Listeners pour le prompt
    document.querySelectorAll('textarea, select').forEach(i => {
        i.addEventListener('input', updatePrompt);
        i.addEventListener('change', updatePrompt);
    });

    // Charger les clés (sécurisé)
    try {
        const saved = localStorage.getItem(API_KEYS_STORAGE);
        if(saved) {
            document.getElementById('api-keys-input').value = saved;
            updateKeyStatus(saved);
            journalLog("Clés chargées depuis la mémoire locale", "success");
        }
    } catch(e) {
        journalLog("Erreur lecture mémoire: " + e.message, "error");
    }

    // Sauvegarder les clés (sécurisé)
    document.getElementById('api-save-btn').addEventListener('click', () => {
        journalLog("Bouton Enregistrer cliqué...");
        try {
            const keys = document.getElementById('api-keys-input').value;
            localStorage.setItem(API_KEYS_STORAGE, keys);
            showToast('Clés API enregistrées localement.', 'success');
            updateKeyStatus(keys);
            journalLog("Clés sauvegardées avec succès !", "success");
        } catch(e) {
            showToast('Erreur de sauvegarde : ' + e.message, 'error');
            journalLog("Erreur sauvegarde: " + e.message, "error");
        }
    });

    // Bouton copier
    document.getElementById('copy-prompt-btn').addEventListener('click', () => {
        const text = document.getElementById('prompt-preview').innerText.replace('Prompt complet\n', '').trim();
        navigator.clipboard.writeText(text);
        showToast('Prompt copié !');
        journalLog("Prompt copié dans le presse-papier");
    });
    
    // Génération
    document.getElementById('generate-btn').addEventListener('click', generateVideo);
    
    updatePrompt();
});

function updatePrompt() {
    const subject = document.getElementById('subject-input').value.trim();
    const action = document.getElementById('action-input').value.trim();
    const shot = document.getElementById('shot-size-select').value;
    const move = document.getElementById('camera-move-select').value;
    const angle = document.getElementById('angle-select').value;
    const lens = document.getElementById('lens-select').value;
    const light = document.getElementById('lighting-select').value;
    const mood = document.getElementById('mood-select').value;
    const style = document.getElementById('style-select').value;
    const ratio = document.getElementById('ratio-select').value;
    const audio = document.getElementById('audio-input').value.trim();
    
    let p = [];
    if(subject) p.push(subject);
    if(action) p.push(action);
    p.push(`Camera: ${shot}, ${move}, ${angle}, ${lens}`);
    p.push(`Lighting: ${light}, ${mood}`);
    p.push(`Style: ${style}, ratio ${ratio}`);
    if(audio) p.push(`Audio: ${audio}`);
    
    const final = p.join('. ') + '.';
    document.getElementById('prompt-preview').innerHTML = '<span class="pp-label">Prompt complet</span>\n' + esc(final);
    
    const hasKeys = document.getElementById('api-keys-input').value.trim().length > 0;
    document.getElementById('generate-btn').disabled = !(subject || action) || !hasKeys;
}

function updateKeyStatus(keysStr) {
    const keys = keysStr.split('\n').map(k => k.trim()).filter(k => k);
    const list = document.getElementById('api-keys-status');
    const statusLine = document.getElementById('api-status-line');
    list.innerHTML = '';
    
    // C'est ici qu'on change la couleur et le texte !
    if (keys.length > 0) {
        document.getElementById('api-status-text').textContent = `${keys.length} clé(s) prête(s)`;
        statusLine.classList.add('ok'); // Rend le point vert
    } else {
        document.getElementById('api-status-text').textContent = 'Aucune clé API enregistrée';
        statusLine.classList.remove('ok');
    }

    keys.forEach((k, i) => {
        const d = document.createElement('div');
        d.className = 'key-row';
        // On cache la clé pour la sécurité
        const masquer = k.substring(0, 6) + '...' + k.substring(k.length - 4);
        d.innerHTML = `<span class="key-id">Clé ${i+1} : ${masquer}</span><span class="key-state">Prête</span>`;
        list.appendChild(d);
    });
}

function generateVideo() {
    const prompt = document.getElementById('prompt-preview').innerText.replace('Prompt complet\n', '').trim();
    journalLog("Lancement de la génération vidéo...");
    
    document.getElementById('generate-btn').style.display = 'none';
    document.getElementById('stop-btn').classList.add('visible');
    document.getElementById('sec-result').classList.remove('hidden');
    document.getElementById('sec-result').classList.add('open');
    document.getElementById('video-placeholder').style.display = 'flex';
    document.getElementById('video-result').classList.add('hidden');
    document.getElementById('status-bar').classList.add('visible');
    document.getElementById('status-text').textContent = 'Envoi à Agnes AI...';

    // Simulation
    setTimeout(() => {
        document.getElementById('status-text').textContent = 'Génération de la vidéo...';
        journalLog("Simulation en cours...");
        setTimeout(() => {
            document.getElementById('status-bar').classList.remove('visible');
            document.getElementById('stop-btn').classList.remove('visible');
            document.getElementById('generate-btn').style.display = 'block';
            document.getElementById('video-placeholder').style.display = 'none';
            document.getElementById('video-result').classList.remove('hidden');
            
            const vid = document.getElementById('result-video');
            vid.src = 'https://www.w3schools.com/html/mov_bbb.mp4';
            document.getElementById('result-meta').textContent = 'Vidéo générée avec succès (Mode Démo)';
            document.getElementById('download-video-link').href = vid.src;
            showToast('Vidéo générée !', 'success');
            journalLog("Vidéo de démo chargée", "success");
        }, 3000);
    }, 2000);
}
</script>
